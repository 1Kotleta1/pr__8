<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Умножение матриц процессами</title>
<style>
  body { font-family: Segoe UI, Arial, sans-serif; margin: 0; background: #f3f5f8; color: #1d2633; }
  header { background: #2b4c7e; color: #fff; padding: 16px 32px; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; opacity: .85; font-size: 14px; }
  main { display: grid; grid-template-columns: 380px 1fr; gap: 20px; padding: 20px 32px; }
  .card { background: #fff; border-radius: 8px; padding: 16px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  h2 { font-size: 16px; margin: 0 0 12px; }
  label { display: block; font-size: 13px; margin: 8px 0 2px; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #c5ccd6; border-radius: 4px; }
  .row { display: flex; gap: 8px; } .row > div { flex: 1; }
  button { margin-top: 14px; padding: 8px 16px; border: 0; border-radius: 4px; background: #2b4c7e; color: #fff; cursor: pointer; }
  .stats { display: flex; gap: 12px; margin-bottom: 16px; }
  .stat { flex: 1; background: #eef2f8; border-radius: 6px; padding: 10px; }
  .stat b { display: block; font-size: 22px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border-bottom: 1px solid #e3e7ee; padding: 6px; text-align: left; }
  pre { background: #f6f8fa; padding: 10px; border-radius: 4px; font-size: 12px; max-height: 220px; overflow: auto; }
  .err { color: #b3261e; }
</style>
</head>
<body>
<header>
  <h1>Умножение двух матриц с помощью процессов</h1>
  <p>Практическая работа №5 как веб-приложение: строки матрицы A делятся между процессами (multiprocessing)</p>
</header>
<main>
  <section class="card">
    <h2>Новый расчёт</h2>
    <label>Название расчёта</label><input id="title" value="Мой расчёт">
    <label>Автор</label><input id="author" value="Студент">
    <div class="row">
      <div><label>Строк A</label><input id="r1" type="number" value="4"></div>
      <div><label>Столбцов A</label><input id="c1" type="number" value="3"></div>
    </div>
    <div class="row">
      <div><label>Строк B</label><input id="r2" type="number" value="3"></div>
      <div><label>Столбцов B</label><input id="c2" type="number" value="4"></div>
    </div>
    <label>Процессов (максимум <span id="cpu">?</span>)</label><input id="proc" type="number" value="2">
    <button onclick="run()">Сгенерировать и умножить</button>
    <div id="out"></div>
  </section>
  <section class="card">
    <div class="stats">
      <div class="stat">Расчётов<b id="s-total">0</b></div>
      <div class="stat">Среднее время, мс<b id="s-avg">0</b></div>
      <div class="stat">Авторов<b id="s-authors">0</b></div>
    </div>
    <h2>История расчётов</h2>
    <table><thead><tr><th>#</th><th>Название</th><th>Автор</th><th>A</th><th>B</th><th>Процессов</th><th>мс</th></tr></thead>
      <tbody id="hist"></tbody></table>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const post = (url, body) => fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});

async function gen(rows, cols) {
  return (await (await post('/api/matrices/generate', {rows, cols})).json()).matrix;
}
async function run() {
  const a = await gen(+$('r1').value, +$('c1').value);
  const b = await gen(+$('r2').value, +$('c2').value);
  const r = await post('/api/multiply', {title: $('title').value, author: $('author').value, a, b, processes: +$('proc').value});
  const data = await r.json();
  if (!r.ok) { $('out').innerHTML = `<p class="err">${data.detail}</p>`; return; }
  $('out').innerHTML = `<p>Готово за ${data.elapsed_ms} мс, процессов: ${data.processes}</p>
    <pre>A = ${JSON.stringify(a)}\nB = ${JSON.stringify(b)}\nC = ${data.result.map(x => JSON.stringify(x)).join('\n    ')}</pre>`;
  load();
}
async function load() {
  const s = await (await fetch('/api/stats')).json();
  $('s-total').textContent = s.total; $('s-avg').textContent = s.avg_ms ?? 0; $('s-authors').textContent = s.authors;
  const h = await (await fetch('/api/history?limit=12')).json();
  $('hist').innerHTML = h.map(x => `<tr><td>${x.id}</td><td>${x.title}</td><td>${x.author}</td>
    <td>${x.rows1}×${x.cols1}</td><td>${x.rows2}×${x.cols2}</td><td>${x.processes}</td><td>${x.elapsed_ms}</td></tr>`).join('');
}
fetch('/api/system').then(r => r.json()).then(s => $('cpu').textContent = s.cpu_count);
load();
</script>
</body>
</html>
